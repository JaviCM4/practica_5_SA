# CONFIGURACION GENERAL DEL MICROSERVICIO ORDER
spring.application.name=order-service
server.port=8081


# POSTGRESQL
spring.datasource.url=jdbc:postgresql://localhost:5433/order_db
spring.datasource.username=poc_user
spring.datasource.password=poc_password
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true


# FLYWAY
spring.flyway.enabled=true


# KAFKA - CONEXION GENERAL
spring.kafka.bootstrap-servers=localhost:9092


# KAFKA - CONSUMIDOR
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=poc.orderservice.events.ShippingEvent


# KAFKA - PRODUCTOR
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false


# CIRCUIT BREAKER - PAYMENT SERVICE
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.paymentService.automatic-transition-from-open-to-half-open-enabled=true


# CIRCUIT BREAKER - INVENTORY SERVICE
resilience4j.circuitbreaker.instances.inventoryService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventoryService.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventoryService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.inventoryService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventoryService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventoryService.automatic-transition-from-open-to-half-open-enabled=true


# CIRCUIT BREAKER - SHIPPING SERVICE
resilience4j.circuitbreaker.instances.shippingService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.shippingService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.shippingService.sliding-window-size=10
resilience4j.circuitbreaker.instances.shippingService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.shippingService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.shippingService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.shippingService.automatic-transition-from-open-to-half-open-enabled=true


# CONFIGURACION DE SPRING
spring.main.allow-bean-definition-overriding=true


# ACTUATOR / OBSERVABILIDAD
management.endpoints.web.exposure.include=health,metrics,circuitbreakers,circuitbreakerevents,retryevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true


# HEALTH INDICATORS DE LOS CIRCUIT BREAKERS
resilience4j.circuitbreaker.instances.paymentService.register-health-indicator=true
resilience4j.circuitbreaker.instances.inventoryService.register-health-indicator=true
resilience4j.circuitbreaker.instances.shippingService.register-health-indicator=true


# RETRY
resilience4j.retry.instances.paymentService.max-attempts=2
resilience4j.retry.instances.paymentService.wait-duration=300ms

resilience4j.retry.instances.inventoryService.max-attempts=2
resilience4j.retry.instances.inventoryService.wait-duration=300ms

resilience4j.retry.instances.shippingService.max-attempts=2
resilience4j.retry.instances.shippingService.wait-duration=300ms